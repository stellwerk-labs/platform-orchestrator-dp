# see https://golangci-lint.run/usage/configuration/
version: '2'

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - goconst
    - gosec
    - mnd
    - sqlclosecheck
    - testifylint
    - funlen
    - whitespace
    # - cyclop # checks function and package cyclomatic complexity

  settings:
    funlen:
      lines: 650
      statements: 200

  exclusions:
    rules:
      - path: '_test\.go$'
        linters:
          - goconst

formatters:
  enable:
    - golines

  settings:
    golines:
      max-len: 300
