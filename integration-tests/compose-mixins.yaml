services:
  nats:
    image: nats:2.12-alpine
    command: ["--jetstream", "--store_dir", "/data", "--http_port", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 2s
      timeout: 2s
      retries: 15
  platform-orchestrator-cp-platform-orchestrator-cp:
    environment:
      LOG_LEVEL: debug
      DD_AGENT_HOST: ""
      SHUTDOWN_DELAY: 1s
      VAULT_AUTH: token:mytoken
      DATA_PLANE_URL: http://platform-orchestrator-dp-platform-orchestrator-dp:8080
    depends_on:
      vault-init:
        condition: service_completed_successfully
  platform-orchestrator-dp-platform-orchestrator-dp:
    environment:
      NATS_BOOTSTRAP: "true"
      LOG_LEVEL: debug
      DD_AGENT_HOST: ""
      SHUTDOWN_DELAY: 1s
      DEPLOYMENTS_COMPLETED_BEFORE: 10s
      VAULT_AUTH: token:mytoken
    depends_on:
      nats:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
      platform-orchestrator-iam-platform-orchestrator-iam:
        condition: service_started
  platform-orchestrator-dp-ready:
    image: nats:2.12-alpine
    entrypoint: ["sh", "-c"]
    command:
      - timeout 60 sh -c 'until wget --spider -q http://platform-orchestrator-dp-platform-orchestrator-dp:8080/health; do sleep 1; done'
    depends_on:
      platform-orchestrator-dp-platform-orchestrator-dp:
        condition: service_started
  runner-gateway:
    image: ghcr.io/stellwerk-labs/platform-orchestrator-runner:v3.0.0
    command: ["gateway"]
    environment:
      NATS_URL: nats://nats:4222
      CONTROL_PLANE_URL: http://platform-orchestrator-cp-platform-orchestrator-cp:8080
      RUNNER_TOKEN_SALT: vnXd0Ses8L1X0TGGcp+mf/V8dQs+L4/fWvijORwb7lI=
      RUNNER_GATEWAY_RECEIPT_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    depends_on:
      platform-orchestrator-dp-ready:
        condition: service_completed_successfully
  platform-orchestrator-iam-platform-orchestrator-iam:
    environment:
      NATS_BOOTSTRAP_STREAMS: "true"
      LOG_LEVEL: debug
      DD_AGENT_HOST: ""
      SHUTDOWN_DELAY: 1s
  vault:
    image: hashicorp/vault:1.14
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: mytoken
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    ports:
      - "8200:8200"
  vault-init:
    image: hashicorp/vault:1.14
    environment:
      VAULT_TOKEN: mytoken
      VAULT_ADDR: http://vault:8200
    depends_on:
      vault:
        condition: service_started
    command:
      - "sh"
      - "-c"
      - "until vault secrets disable transit; do sleep 3; done; vault secrets enable transit"
volumes:
  nats-data:
