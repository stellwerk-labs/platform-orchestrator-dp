apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-orchestrator-runner
  namespace: platform-orchestrator-runner
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-orchestrator-runner
  namespace: platform-orchestrator-runner
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
      - get
      - list
      - update
  - apiGroups:
      - "coordination.k8s.io"
    resources:
      - leases
    verbs:
      - create
      - get
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-orchestrator-runner
  namespace: platform-orchestrator-runner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: platform-orchestrator-runner
subjects:
- kind: ServiceAccount
  name: platform-orchestrator-runner
