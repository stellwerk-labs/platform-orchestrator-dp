apiVersion: score.dev/v1b1
metadata:
  name: platform-orchestrator-cp
service:
  ports:
    http:
      port: 8080
containers:
  platform-orchestrator-cp:
    image: ghcr.io/stellwerk-labs/platform-orchestrator-cp:v2.0.0
    command: ["/opt/server/server"]
    livenessProbe:
      httpGet:
        path: /alive
        port: 8080
    readinessProbe:
      httpGet:
        path: /health
        port: 8080
    resources:
      limits:
        cpu: "1"
        memory: 256Mi
      requests:
        cpu: "0.025"
        memory: 64Mi
    variables:
      NATS_URL: ${resources.env.NATS_URL}
      DD_AGENT_HOST: $${pod.status.hostIP}
      DD_ENABLE: ${resources.env.DATADOG_ENABLED}
      DD_ENV: ${resources.env.DATADOG_ENV}
      DD_SERVICE: ${metadata.name}
      DD_TRACE_HTTP_CLIENT_ERROR_STATUSES: 500-600
      PORT: "8080"
      DATABASE_HOST: ${resources.postgres.host}
      DATABASE_NAME: ${resources.postgres.name}
      DATABASE_PASSWORD: ${resources.postgres.password}
      DATABASE_PORT: ${resources.postgres.port}
      DATABASE_USER: ${resources.postgres.username}
      VAULT_URL: ${resources.env.VAULT_URL}
      VAULT_AUTH: kubernetes:platform-orchestrator-platform-orchestrator-cp
      IAM_URL: http://${resources.platform-orchestrator-iam.name}:8080

resources:
  env:
    type: environment
  platform-orchestrator-iam:
    type: service
  postgres:
    type: postgres
  dns:
    type: dns
    id: api-dns
  route:
    type: route
    params:
      host: ${resources.dns.host}
      port: 8080
      path: /orgs/[^/]+/(projects|env-types|resource-types|module-providers|runners|runner-rules|modules|module-rules)
