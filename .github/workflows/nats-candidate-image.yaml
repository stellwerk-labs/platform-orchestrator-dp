name: NATS candidate image

on:
  push:
    branches:
      - feat/nats

concurrency:
  group: nats-candidate-image
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          target: final
          tags: |
            ghcr.io/stellwerk-labs/platform-orchestrator-dp:nats-candidate
            ghcr.io/stellwerk-labs/platform-orchestrator-dp:nats-${{ github.sha }}
