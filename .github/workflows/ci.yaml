name: CI

on:
  workflow_dispatch:
    inputs:
      candidate_tag:
        description: "Pre-existing approved vX.Y.Z-rc.N tag (never stable/latest)"
        required: true
        type: string
      candidate_sha:
        description: "Approved full 40-character commit SHA identified by that tag"
        required: true
        type: string
      seed_only:
        description: "Build only a human-approved CI dependency image, never a release"
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOCKER_BUILDKIT: "1"

jobs:
  candidate-preflight:
    if: github.repository == 'stellwerk-labs/platform-orchestrator-dp' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout approved candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require immutable candidate and pre-provisioned reviewer approval
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/environments/public-release-candidate" > "$RUNNER_TEMP/candidate-environment.json"
          python3 scripts/candidate-release.py "$CANDIDATE_TAG" "$CANDIDATE_SHA" \
            --environment-json "$RUNNER_TEMP/candidate-environment.json"

  candidate-release:
    if: github.repository == 'stellwerk-labs/platform-orchestrator-dp' && github.event_name == 'workflow_dispatch' && !inputs.seed_only
    needs:
      - candidate-preflight
      - verify
      - integration
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: public-release-candidate
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
      packages: write
    steps:
      - name: Checkout tested immutable candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Revalidate candidate and refuse existing publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/environments/public-release-candidate" > "$RUNNER_TEMP/candidate-environment.json"
          python3 scripts/candidate-release.py "$CANDIDATE_TAG" "$CANDIDATE_SHA" \
            --environment-json "$RUNNER_TEMP/candidate-environment.json" \
            --check-image-absent "$GITHUB_REPOSITORY"

      - name: Reserve candidate release without creating a tag or changing latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
        run: |
          set -euo pipefail
          gh release create "$CANDIDATE_TAG" --verify-tag --prerelease --latest=false \
            --title "$CANDIDATE_TAG" --notes-file "docs/releases/$CANDIDATE_TAG.md"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.0.0

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.0.0
        with:
          driver-opts: image=moby/buildkit@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea

      - name: Setup pinned artifact Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.2'
          cache: false

      - name: Install verified artifact tools and bind source epoch
        run: |
          set -euo pipefail
          bash scripts/install-release-tools.sh "$RUNNER_TEMP/release-tools"
          bash scripts/install-oras.sh "$RUNNER_TEMP/release-tools"
          echo "$RUNNER_TEMP/release-tools" >> "$GITHUB_PATH"
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
          test "$(git rev-parse HEAD)" = "${{ inputs.candidate_sha }}"

      - name: Build complete local OCI artifact before publication
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.0.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          outputs: type=oci,dest=${{ runner.temp }}/server-image.tar,oci-mediatypes=true,compression=gzip,compression-level=6,force-compression=true,rewrite-timestamp=true
          build-args: |
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
          target: final
          tags: ghcr.io/stellwerk-labs/platform-orchestrator-dp:${{ inputs.candidate_tag }}
          sbom: true
          provenance: mode=max
          labels: |
            org.opencontainers.image.version=${{ inputs.candidate_tag }}
            org.opencontainers.image.revision=${{ inputs.candidate_sha }}

      - name: Rebuild platform payloads without instruction cache
        id: image-repro
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.0.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          no-cache: true
          outputs: type=oci,dest=${{ runner.temp }}/server-image-repro.tar,oci-mediatypes=true,compression=gzip,compression-level=6,force-compression=true,rewrite-timestamp=true
          build-args: |
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
          target: final
          tags: ghcr.io/stellwerk-labs/platform-orchestrator-dp:${{ inputs.candidate_tag }}
          sbom: true
          provenance: mode=max
          labels: |
            org.opencontainers.image.version=${{ inputs.candidate_tag }}
            org.opencontainers.image.revision=${{ inputs.candidate_sha }}

      - name: Validate and scan exact platform payloads, notices and SBOM
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/server-layout" "$RUNNER_TEMP/server-layout-repro"
          tar -xf "$RUNNER_TEMP/server-image.tar" -C "$RUNNER_TEMP/server-layout"
          tar -xf "$RUNNER_TEMP/server-image-repro.tar" -C "$RUNNER_TEMP/server-layout-repro"
          bash scripts/check-server-artifact.sh "$RUNNER_TEMP/server-layout" "$RUNNER_TEMP/server-inspection" "amd64,arm64"
          bash scripts/check-server-artifact.sh "$RUNNER_TEMP/server-layout-repro" "$RUNNER_TEMP/server-inspection-repro" "amd64,arm64"
          test "$(jq -er .index "$RUNNER_TEMP/server-inspection/report.json")" = "$IMAGE_DIGEST"
          python3 scripts/release_content.py compare "$RUNNER_TEMP/server-inspection/report.json" \
            "$RUNNER_TEMP/server-inspection-repro/report.json" > "$RUNNER_TEMP/server-reproducibility.json"
          bash scripts/generate-server-sbom.sh "$RUNNER_TEMP/server-layout" "$RUNNER_TEMP/server-inspection" "$RUNNER_TEMP/server-sbom"
          mkdir "$RUNNER_TEMP/server-evidence"
          cp "$RUNNER_TEMP/server-inspection/report.json" "$RUNNER_TEMP/server-evidence/platforms.json"
          cp "$RUNNER_TEMP/server-inspection-repro/report.json" "$RUNNER_TEMP/server-evidence/rebuild-platforms.json"
          cp "$RUNNER_TEMP/server-reproducibility.json" "$RUNNER_TEMP/server-evidence/reproducibility.json"
          cp "$RUNNER_TEMP/server-sbom/"*.spdx.json "$RUNNER_TEMP/server-evidence/"
          bash scripts/scan-release-content.sh "$RUNNER_TEMP/server-evidence"

      - name: Retain digest-bound artifact evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: server-artifact-evidence-${{ github.job }}
          path: ${{ runner.temp }}/server-evidence/
          if-no-files-found: error

      - name: Publish only the inspected OCI layout without changing attestations
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE_TAG: ghcr.io/stellwerk-labs/platform-orchestrator-dp:${{ inputs.candidate_tag }}
        run: |
          set -euo pipefail
          OCI_REFERENCE="$(python3 scripts/release_content.py oci-reference "$RUNNER_TEMP/server-layout" "$IMAGE_DIGEST")"
          oras cp --no-tty --from-oci-layout "$RUNNER_TEMP/server-layout:$OCI_REFERENCE" "$IMAGE_TAG"
          test "$(oras resolve "$IMAGE_TAG")" = "$IMAGE_DIGEST"

      - name: Verify candidate image by immutable digest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools inspect "ghcr.io/stellwerk-labs/platform-orchestrator-dp@$IMAGE_DIGEST"

  candidate-seed:
    if: github.repository == 'stellwerk-labs/platform-orchestrator-dp' && github.event_name == 'workflow_dispatch' && inputs.seed_only
    needs:
      - candidate-preflight
      - verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: public-release-candidate
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - name: Checkout verified immutable candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Revalidate candidate and refuse an existing seed image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/environments/public-release-candidate" > "$RUNNER_TEMP/candidate-environment.json"
          python3 scripts/candidate-release.py "$CANDIDATE_TAG" "$CANDIDATE_SHA" \
            --environment-json "$RUNNER_TEMP/candidate-environment.json" --seed-image

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.0.0
        with:
          driver-opts: image=moby/buildkit@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea

      - name: Setup pinned artifact Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.2'
          cache: false

      - name: Install verified artifact tools and bind source epoch
        run: |
          set -euo pipefail
          bash scripts/install-release-tools.sh "$RUNNER_TEMP/release-tools"
          bash scripts/install-oras.sh "$RUNNER_TEMP/release-tools"
          echo "$RUNNER_TEMP/release-tools" >> "$GITHUB_PATH"
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
          test "$(git rev-parse HEAD)" = "${{ inputs.candidate_sha }}"

      - name: Build complete local OCI artifact before publication
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.0.0
        with:
          context: .
          target: final
          platforms: linux/amd64
          push: false
          outputs: type=oci,dest=${{ runner.temp }}/server-image.tar,oci-mediatypes=true,compression=gzip,compression-level=6,force-compression=true,rewrite-timestamp=true
          build-args: |
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
          tags: ghcr.io/stellwerk-labs/platform-orchestrator-dp:ci-seed-${{ inputs.candidate_sha }}
          sbom: true
          provenance: mode=max
          labels: |
            org.opencontainers.image.revision=${{ inputs.candidate_sha }}
            org.opencontainers.image.description=CI dependency seed; not a qualified release

      - name: Rebuild platform payloads without instruction cache
        id: image-repro
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.0.0
        with:
          context: .
          target: final
          platforms: linux/amd64
          push: false
          no-cache: true
          outputs: type=oci,dest=${{ runner.temp }}/server-image-repro.tar,oci-mediatypes=true,compression=gzip,compression-level=6,force-compression=true,rewrite-timestamp=true
          build-args: |
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
          tags: ghcr.io/stellwerk-labs/platform-orchestrator-dp:ci-seed-${{ inputs.candidate_sha }}
          sbom: true
          provenance: mode=max
          labels: |
            org.opencontainers.image.revision=${{ inputs.candidate_sha }}
            org.opencontainers.image.description=CI dependency seed; not a qualified release

      - name: Validate and scan exact platform payloads, notices and SBOM
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/server-layout" "$RUNNER_TEMP/server-layout-repro"
          tar -xf "$RUNNER_TEMP/server-image.tar" -C "$RUNNER_TEMP/server-layout"
          tar -xf "$RUNNER_TEMP/server-image-repro.tar" -C "$RUNNER_TEMP/server-layout-repro"
          bash scripts/check-server-artifact.sh "$RUNNER_TEMP/server-layout" "$RUNNER_TEMP/server-inspection" "amd64"
          bash scripts/check-server-artifact.sh "$RUNNER_TEMP/server-layout-repro" "$RUNNER_TEMP/server-inspection-repro" "amd64"
          test "$(jq -er .index "$RUNNER_TEMP/server-inspection/report.json")" = "$IMAGE_DIGEST"
          python3 scripts/release_content.py compare "$RUNNER_TEMP/server-inspection/report.json" \
            "$RUNNER_TEMP/server-inspection-repro/report.json" > "$RUNNER_TEMP/server-reproducibility.json"
          bash scripts/generate-server-sbom.sh "$RUNNER_TEMP/server-layout" "$RUNNER_TEMP/server-inspection" "$RUNNER_TEMP/server-sbom"
          mkdir "$RUNNER_TEMP/server-evidence"
          cp "$RUNNER_TEMP/server-inspection/report.json" "$RUNNER_TEMP/server-evidence/platforms.json"
          cp "$RUNNER_TEMP/server-inspection-repro/report.json" "$RUNNER_TEMP/server-evidence/rebuild-platforms.json"
          cp "$RUNNER_TEMP/server-reproducibility.json" "$RUNNER_TEMP/server-evidence/reproducibility.json"
          cp "$RUNNER_TEMP/server-sbom/"*.spdx.json "$RUNNER_TEMP/server-evidence/"
          bash scripts/scan-release-content.sh "$RUNNER_TEMP/server-evidence"

      - name: Retain digest-bound artifact evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: server-artifact-evidence-${{ github.job }}
          path: ${{ runner.temp }}/server-evidence/
          if-no-files-found: error

      - name: Publish only the inspected OCI layout without changing attestations
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE_TAG: ghcr.io/stellwerk-labs/platform-orchestrator-dp:ci-seed-${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          OCI_REFERENCE="$(python3 scripts/release_content.py oci-reference "$RUNNER_TEMP/server-layout" "$IMAGE_DIGEST")"
          oras cp --no-tty --from-oci-layout "$RUNNER_TEMP/server-layout:$OCI_REFERENCE" "$IMAGE_TAG"
          test "$(oras resolve "$IMAGE_TAG")" = "$IMAGE_DIGEST"

      - name: Record the immutable CI dependency pin
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          image="ghcr.io/stellwerk-labs/platform-orchestrator-dp@$IMAGE_DIGEST"
          docker buildx imagetools inspect "$image"
          printf 'CI dependency only: `%s`\n\nRun normal candidate integration and publication separately.\n' "$image" >> "$GITHUB_STEP_SUMMARY"

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.ref }}

      - name: Test publication contracts
        run: |
          python3 scripts/candidate-release_test.py
          python3 scripts/stable-release-preflight_test.py

      - name: Checkout the exact semantic-release action
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: stellwerk-labs/semantic-release-action
          ref: b1269e93b486873118eef1646bfcd46a9d23d3a3
          path: .release-tools
          persist-credentials: false

      - name: Test version assignment without credentials or network
        run: |
          set -euo pipefail
          docker build -t dp-semantic-release-contract .release-tools
          docker run --rm --network none \
            --mount "type=bind,source=$PWD,target=/checkout,readonly" \
            --entrypoint sh dp-semantic-release-contract \
            /checkout/scripts/test-release-versioning.sh

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Verify artifact helper contracts with pinned tools
        run: |
          bash scripts/install-release-tools.sh "$RUNNER_TEMP/release-tools"
          PATH="$RUNNER_TEMP/release-tools:$PATH" python3 -m unittest discover -s scripts -p 'release_*_test.py' -v

      - name: Generate
        run: make generate

      - name: Tidy modules
        run: |
          go mod tidy
          cd shared
          go mod tidy

      - name: Check generated and module files
        run: git diff --exit-code

      - name: Vet
        run: |
          go vet ./...
          cd shared
          go vet ./...

      - name: Unit tests
        run: make test-unit

      - name: Lint
        uses: golangci/golangci-lint-action@db9de0fc1a667e1a49d2291a1a042dff081d78f6 # v9
        with:
          version: v2.11.4

      - name: Test digest-pinned Runner image references
        run: bash scripts/integration-runner-image_test.sh

      - name: Build container
        run: docker build --target final --tag platform-orchestrator-dp:ci .

      - name: Upload unit test coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unit-test-coverage
          path: cover.out

  integration:
    if: ${{ !inputs.seed_only }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      CP_IMAGE: ${{ vars.CORE_CP_INTEGRATION_IMAGE }}
      IAM_IMAGE: ${{ vars.CORE_IAM_INTEGRATION_IMAGE }}
      RUNNER_IMAGE: ${{ vars.CORE_RUNNER_INTEGRATION_IMAGE }}
    steps:
      - name: Require the compatible Core candidate image set
        shell: bash
        run: |
          for image_variable in CP_IMAGE IAM_IMAGE RUNNER_IMAGE; do
            if [[ ! "${!image_variable}" =~ @sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Set CORE_${image_variable%_IMAGE}_INTEGRATION_IMAGE to the compatible image digest recorded in the OSS release manifest. Pre-module-management fallback images are not valid."
              exit 1
            fi
          done
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.ref }}

      - name: Disable Docker containerd image store
        run: |
          sudo mkdir -p /etc/docker
          echo '{"features": {"containerd-snapshotter": false}}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false

      - name: Setup Score Compose
        uses: score-spec/setup-score@888a7deafd396c3f3f05e00d2d9b0ab225799ac0 # v3.2.4
        with:
          file: score-compose
          version: 0.17.0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Helm
        uses: azure/setup-helm@59b1c81c6280f5abebb1fb1bc585696daa7dfb42 # v5

      - name: Run integration tests
        run: make test-integration
        env:
          TEST_PARALLEL: "1"
          TEST_TIMEOUT: 20m

      - name: Show integration test logs
        if: always()
        run: make test-integration-logs

      - name: Clean integration resources
        if: always()
        run: make clean

  release:
    if: github.repository == 'stellwerk-labs/platform-orchestrator-dp' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - verify
      - integration
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      packages: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Assign stable version and tag
        id: release
        uses: stellwerk-labs/semantic-release-action@b1269e93b486873118eef1646bfcd46a9d23d3a3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate stable source, notes, and unused destinations
        if: steps.release.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.version }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 scripts/stable-release-preflight.py "$RELEASE_TAG" "$SOURCE_SHA"

      - name: Reserve stable draft with reviewed notes
        if: steps.release.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" --verify-tag --draft --latest=false \
            --title "$RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"

      - name: Login to GitHub Container Registry
        if: steps.release.outputs.version != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup QEMU
        if: steps.release.outputs.version != ''
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.0.0

      - name: Setup Docker Buildx
        if: steps.release.outputs.version != ''
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.0.0
        with:
          driver-opts: image=moby/buildkit@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea

      - name: Setup pinned artifact Go toolchain
        if: steps.release.outputs.version != ''
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.2'
          cache: false

      - name: Install verified artifact tools and bind source epoch
        if: steps.release.outputs.version != ''
        run: |
          set -euo pipefail
          bash scripts/install-release-tools.sh "$RUNNER_TEMP/release-tools"
          bash scripts/install-oras.sh "$RUNNER_TEMP/release-tools"
          echo "$RUNNER_TEMP/release-tools" >> "$GITHUB_PATH"
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Build complete local OCI artifact before publication
        if: steps.release.outputs.version != ''
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.0.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          outputs: type=oci,dest=${{ runner.temp }}/server-image.tar,oci-mediatypes=true,compression=gzip,compression-level=6,force-compression=true,rewrite-timestamp=true
          build-args: |
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
          target: final
          tags: ghcr.io/stellwerk-labs/platform-orchestrator-dp:${{ steps.release.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max
          labels: |
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Rebuild platform payloads without instruction cache
        if: steps.release.outputs.version != ''
        id: image-repro
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.0.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          no-cache: true
          outputs: type=oci,dest=${{ runner.temp }}/server-image-repro.tar,oci-mediatypes=true,compression=gzip,compression-level=6,force-compression=true,rewrite-timestamp=true
          build-args: |
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
          target: final
          tags: ghcr.io/stellwerk-labs/platform-orchestrator-dp:${{ steps.release.outputs.version }}
          sbom: true
          provenance: mode=max
          labels: |
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Validate and scan exact platform payloads, notices and SBOM
        if: steps.release.outputs.version != ''
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/server-layout" "$RUNNER_TEMP/server-layout-repro"
          tar -xf "$RUNNER_TEMP/server-image.tar" -C "$RUNNER_TEMP/server-layout"
          tar -xf "$RUNNER_TEMP/server-image-repro.tar" -C "$RUNNER_TEMP/server-layout-repro"
          bash scripts/check-server-artifact.sh "$RUNNER_TEMP/server-layout" "$RUNNER_TEMP/server-inspection" "amd64,arm64"
          bash scripts/check-server-artifact.sh "$RUNNER_TEMP/server-layout-repro" "$RUNNER_TEMP/server-inspection-repro" "amd64,arm64"
          test "$(jq -er .index "$RUNNER_TEMP/server-inspection/report.json")" = "$IMAGE_DIGEST"
          python3 scripts/release_content.py compare "$RUNNER_TEMP/server-inspection/report.json" \
            "$RUNNER_TEMP/server-inspection-repro/report.json" > "$RUNNER_TEMP/server-reproducibility.json"
          bash scripts/generate-server-sbom.sh "$RUNNER_TEMP/server-layout" "$RUNNER_TEMP/server-inspection" "$RUNNER_TEMP/server-sbom"
          mkdir "$RUNNER_TEMP/server-evidence"
          cp "$RUNNER_TEMP/server-inspection/report.json" "$RUNNER_TEMP/server-evidence/platforms.json"
          cp "$RUNNER_TEMP/server-inspection-repro/report.json" "$RUNNER_TEMP/server-evidence/rebuild-platforms.json"
          cp "$RUNNER_TEMP/server-reproducibility.json" "$RUNNER_TEMP/server-evidence/reproducibility.json"
          cp "$RUNNER_TEMP/server-sbom/"*.spdx.json "$RUNNER_TEMP/server-evidence/"
          bash scripts/scan-release-content.sh "$RUNNER_TEMP/server-evidence"

      - name: Retain digest-bound artifact evidence
        if: steps.release.outputs.version != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: server-artifact-evidence-${{ github.job }}
          path: ${{ runner.temp }}/server-evidence/
          if-no-files-found: error

      - name: Publish only the inspected OCI layout without changing attestations
        if: steps.release.outputs.version != ''
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE_TAG: ghcr.io/stellwerk-labs/platform-orchestrator-dp:${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          OCI_REFERENCE="$(python3 scripts/release_content.py oci-reference "$RUNNER_TEMP/server-layout" "$IMAGE_DIGEST")"
          oras cp --no-tty --from-oci-layout "$RUNNER_TEMP/server-layout:$OCI_REFERENCE" "$IMAGE_TAG"
          test "$(oras resolve "$IMAGE_TAG")" = "$IMAGE_DIGEST"

      - name: Verify published image
        if: steps.release.outputs.version != ''
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools inspect "ghcr.io/stellwerk-labs/platform-orchestrator-dp@${IMAGE_DIGEST}"

      - name: Publish verified stable release
        if: steps.release.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          gh release edit "$RELEASE_TAG" --draft=false --latest
